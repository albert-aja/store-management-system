# ==============================================================================
# STORE MANAGEMENT SYSTEM (SMS) — PRODUCTION REDIS CONFIGURATION
# Module: Infrastructure Setup (Backlog [A.2])
# ==============================================================================

# Networking & Security
bind 0.0.0.0
port 6379
protected-mode yes
timeout 300
tcp-keepalive 60

# Authentication
# Must match REDIS_PASSWORD in .env
requirepass ${REDIS_PASSWORD:sms_redis_secret_password_2026}

# Memory Management
# 512MB RAM cap for document sequences, short-lived query cache, and GPS buffers
maxmemory 536870912
maxmemory-policy volatile-lru
maxmemory-samples 5

# Persistence & Durability (AOF + RDB)
# Crucial: Ensures atomic document number sequences (DOC_SEQ:*) are never lost on crash
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Concurrency & Performance
tcp-backlog 511
databases 16
loglevel notice
logfile ""
slowlog-log-slower-than 10000
slowlog-max-len 128

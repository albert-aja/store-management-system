spring:
  application:
    name: core-backend-test

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://test.supabase.co/auth/v1/.well-known/jwks.json

supabase:
  url: https://test.supabase.co
  service-role-key: test-mock-service-role-key
  default-bucket: sms-documents

server:
  port: 0

logging:
  level:
    com.sms: INFO
    org.flywaydb: INFO

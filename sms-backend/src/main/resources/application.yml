spring:
  application:
    name: sms-backend

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/sms}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase project JWKS endpoint, e.g. https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://localhost/auth/v1/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8080}

supabase:
  url: ${SUPABASE_URL:https://localhost}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  default-bucket: ${SUPABASE_STORAGE_BUCKET:sms-documents}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sms: INFO
